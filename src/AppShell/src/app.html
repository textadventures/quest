<!doctype html>
<html lang="en" data-theme="wintry">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Quest Viva</title>
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <!-- Site-level link-preview tags. Static, so a shared /play/<id> link gets the
         same generic card as the homepage — no og:url or canonical, which would tell
         scrapers every such link *is* the homepage. og:image must be an absolute URL
         and a raster image (scrapers ignore SVG). -->
    <meta name="description" content="Play and create text adventure games in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quest Viva" />
    <meta property="og:title" content="Quest Viva" />
    <meta property="og:description" content="Play and create text adventure games in your browser." />
    <meta property="og:image" content="https://play.questviva.com/og-image.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Applies the stored Light/Dark/Match-system theme before first paint —
         same logic as theme-store.ts's applyTheme, but runs synchronously while
         the head is still parsing so there's no flash of the wrong theme. -->
    <script>
        (function () {
            try {
                let pref = null;
                try {
                    pref = window.electronApp && window.electronApp.theme ? window.electronApp.theme.getSync() : localStorage.getItem("questviva-ui-theme");
                } catch {
                    pref = null;
                }
                if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
                const dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.classList.toggle("dark", dark);
                document.documentElement.style.colorScheme = dark ? "dark" : "light";
            } catch {}
        })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" autocapitalize="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
