<qv-player>
    <div class="qv-layout">
        <main data-qv-part="border">
            <header class="qv-topbar">
                <div data-qv-part="location" class="qv-empty"></div>
                <div class="qv-toolbar">
                    <!-- The host shows these as the session allows (WebPlayer.setCanDebug/setCanSave),
                         adds a Restart button after Debug in editor previews, and translates the labels
                         (data-chrome-key*). -->
                    <button id="cmdDebug" type="button" style="display: none">Debug</button>
                    <button id="cmdSave" type="button" data-chrome-key="SaveLoadTitle">Save / Load</button>
                    <button class="qv-panes-button" type="button" aria-expanded="false"
                            data-chrome-key-aria-label="ShowPanesButton" aria-label="Show panels">&#9776;</button>
                </div>
            </header>
            <qv-output data-qv-part="output"></qv-output>
            <qv-command-bar data-qv-part="command-bar"></qv-command-bar>
        </main>
        <aside class="qv-panes" data-qv-part="panes">
            <qv-pane data-qv-pane="inventory" label="Inventory"></qv-pane>
            <qv-pane data-qv-pane="objects" label="Places and Objects"></qv-pane>
            <qv-pane data-qv-pane="commands" hidden></qv-pane>
            <qv-pane data-qv-pane="customstatus" hidden></qv-pane>
        </aside>
    </div>
    <qv-verb-menu data-qv-part="menu"></qv-verb-menu>
</qv-player>
