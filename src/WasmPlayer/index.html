<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quest Viva</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Site-level link-preview tags. This page is static and only learns which game
         it's playing after boot, so a shared ?id= link can't name the game — keep the
         card small and generic: no og:image, and no og:url or canonical, which would
         tell scrapers every game link *is* one page. -->
    <meta name="description" content="Play and create text adventure games in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quest Viva" />
    <meta property="og:title" content="Quest Viva" />
    <meta property="og:description" content="Play and create text adventure games in your browser." />
    <!-- Lets the preload scanner start the runtime loader before the parser has
         even reached wasm-player.js, which as the last script in this head only
         executes once jQuery/jQuery UI/paper.js have all downloaded *and* run.
         It's 37 KB, so it's unconditional rather than gated on a game actually
         being on its way — the ~10.6 MB the loader then pulls is what's gated,
         in wasm-player.js's boot IIFE. Stamped with ?v= like every other asset
         here (scripts/inject-version.mjs), which is also what makes the
         preload and wasm-player.js's own import() agree on one URL and share a
         single fetch. -->
    <link rel="modulepreload" href="_framework/dotnet.js" />
    <script type="text/javascript" src="quest-config.js"></script>
    <script type="text/javascript">
        // Runs before the start screen is parsed, so when a game is specified via the
        // URL (or a defaultGameUrl is configured) we paint straight into the loading
        // state — otherwise the file/URL pickers render for a frame before
        // showLoading() gets a chance to hide them.
        (function () {
            var params = new URLSearchParams(location.search);
            if (params.get('id') || params.get('url') || params.get('source') === 'editor'
                || params.get('source') === 'local' || params.get('source') === 'qv'
                || window.QuestVivaConfig?.defaultGameUrl) {
                document.documentElement.classList.add('qv-booting');
            }
        })();
    </script>
    <style type="text/css">
        html.qv-booting #qv-pickers { display: none; }
        html.qv-booting #qv-loading-msg { display: flex; }
    </style>
    <!-- The player UI a game plays on (legacy/ or v2/) isn't loaded here: wasm-player.js loads
         just the one the game gets, once it's known (see preparePlayerUi), and puts its
         stylesheets before this one. -->
    <!-- App-chrome styles (start screen, debugger, save-slot manager). Built from
         styles/chrome.css via `npm run build` — see WasmPlayer/package.json. All of
         its rules are contained to `.qv-chrome` subtrees so they can't affect the
         game UI. -->
    <link rel="stylesheet" type="text/css" href="chrome.css" />
    <script type="text/javascript" src="game-saver.js"></script>
    <!-- VERSION_SCRIPT: spliced in at build time by scripts/inject-version.mjs
         (into wwwroot/index.html) — sets window.QuestVivaVersion from the
         repo-root VERSION file before wasm-player.js runs. -->
    <script type="text/javascript" src="wasm-player.js"></script>
</head>
<body>
<div id="qv-start" class="qv-chrome">
    <div class="card preset-filled-surface-100-900 w-full max-w-md p-8 space-y-6" data-theme="wintry">
        <div id="qv-brand">
            <h1 class="h2 flex items-center gap-4">
                <img src="logo.svg" alt="" class="h-7" />
                Quest Viva
            </h1>
        </div>

        <!-- The game being loaded, once its name is known: from textadventures.co.uk's
             api/Game for ?id=, or from the game itself once it has loaded (showGameInfo in
             wasm-player.js). Replaces the big Quest Viva heading with a small one below. -->
        <div id="qv-game-info" class="hidden flex-col items-center gap-3 text-center">
            <img id="qv-game-cover" alt="" class="hidden w-40 max-h-60 object-contain rounded-lg" />
            <h1 id="qv-game-name" class="h2 break-words"></h1>
            <p id="qv-game-author" class="hidden text-surface-500"></p>
        </div>

        <div id="qv-error" class="hidden card preset-tonal-error p-4 text-sm"></div>

        <div id="qv-pickers" class="space-y-4">
            <div>
                <span class="label-text text-xs uppercase tracking-wide text-surface-500">Open a game file</span>
                <button id="qv-file-btn" type="button" class="btn preset-tonal-primary w-full justify-start mt-2">
                    <svg class="qv-icon" aria-hidden="true"><use href="#folder-open"></use></svg>
                    Choose file (.quest, .aslx, .asl, .cas)
                </button>
                <input type="file" id="qv-file-input" class="hidden" accept=".quest,.aslx,.asl,.cas">
            </div>

            <div class="flex items-center gap-3 text-surface-500 text-xs">
                <hr class="hr flex-1">
                or
                <hr class="hr flex-1">
            </div>

            <div>
                <label class="label-text text-xs uppercase tracking-wide text-surface-500" for="qv-url-input">Load from URL</label>
                <div class="flex gap-2 mt-2">
                    <input type="url" id="qv-url-input" class="input" placeholder="https://&hellip;" autocomplete="off" spellcheck="false">
                    <button id="qv-url-btn" type="button" class="btn preset-filled-primary-500">Load</button>
                </div>
            </div>
        </div>

        <div id="qv-loading-msg" class="hidden flex-col items-center gap-3 text-surface-500 text-sm text-center">
            <div class="animate-spin rounded-full h-8 w-8 border-2 border-surface-400-600 border-t-transparent" aria-hidden="true"></div>
            <span>Loading&hellip;</span>
        </div>

        <div id="qv-clicktobegin" class="hidden flex-col items-center gap-3 text-surface-500 text-sm text-center">
            <button id="qv-clicktobegin-btn" type="button" class="btn btn-lg preset-filled-primary-500 min-w-40 min-h-12">Begin</button>
        </div>

        <div id="qv-brand-small" class="hidden items-center justify-center gap-2 text-xs text-surface-500">
            <img src="logo.svg" alt="" class="h-3" />
            Quest Viva
        </div>
    </div>
</div>

<!-- Shown by restartGameCore (wasm-player.js) around the actual restart —
     Bridge.Initialise re-parses the embedded Core library XML from scratch
     every time (confirmed not cacheable), which blocks the single WASM UI
     thread for a couple of seconds with no way for anything else to paint
     meanwhile. A plain "Loading…" div sitting in the DOM the whole time
     wouldn't help — see nextPaint()'s doc comment — restartGameCore
     explicitly yields a frame after unhiding this so it's actually visible
     before the freeze starts. Not a <dialog>: it only needs to sit above the
     ordinary game chrome, never above qv-saves/questVivaDebugger (both
     already closed by the time this shows — see restartGameCore). Same
     spinner styling as #qv-loading-msg above for a consistent look. -->
<div id="qv-restarting" class="qv-chrome hidden" role="status" aria-live="polite">
    <div class="flex flex-col items-center gap-3 text-surface-100 text-sm text-center">
        <div class="animate-spin rounded-full h-8 w-8 border-2 border-surface-300 border-t-transparent" aria-hidden="true"></div>
        <span>Restarting&hellip;</span>
    </div>
</div>

<!-- Shown by beginRecording (wasm-player.js) for the lifetime of an editor-launched
     "Record Walkthrough" preview session (see AppShell's ListEditor.svelte Record
     button and editor-store.ts's recordWalkthrough/previewInWasmPlayer). Non-modal
     and non-blocking, unlike #qv-restarting above — the game stays fully playable
     while this is up, it just floats over the chrome reporting progress. Preserved
     across swapInPlayerUi() (a mid-session restart) the same way #qv-restarting is,
     so a restart mid-recording doesn't lose the banner (recordedSteps itself is
     plain JS module state and survives a restart regardless). -->
<div id="qv-recording" class="qv-chrome hidden" role="status" aria-live="polite">
    <div class="flex items-center gap-2 preset-filled-error-500 rounded-full px-3 py-1.5 text-sm shadow-lg">
        <span class="inline-block h-2 w-2 rounded-full bg-current animate-pulse" aria-hidden="true"></span>
        <span id="qv-recording-status">Recording&hellip;</span>
        <button id="qv-recording-stop" type="button" class="btn-icon preset-tonal-surface ml-1" aria-label="Stop recording">
            <svg class="qv-icon" aria-hidden="true"><use href="#square"></use></svg>
        </button>
    </div>
</div>

<dialog id="qv-saves" class="qv-chrome" data-mode="boot" aria-labelledby="qv-saves-heading-boot">
    <!-- ICONS_SPRITE: spliced in at build time by scripts/build-icons.mjs (into
         wwwroot/index.html) — a hidden <symbol> defs block, kept inside
         #qv-saves so it survives the dialog's detach/reattach around the
         document.body.innerHTML swap in wasm-player.js. Cross-document SVG
         <use href="file.svg#id"> isn't reliably supported (notably not in
         Chrome), so the sprite must live in the same document as its <use>s. -->
    <div class="card preset-filled-surface-100-900 w-full p-5 space-y-4" data-theme="wintry">
        <div class="flex items-center justify-between gap-4">
            <h2 class="h4" id="qv-saves-heading-boot" data-mode-text="boot" data-chrome-key="ContinueYourGamePrompt">Continue your game?</h2>
            <h2 class="h4 qv-manage-only" id="qv-saves-heading-manage" data-mode-text="manage" data-chrome-key="SavedGamesHeading">Saved games</h2>
            <button id="qv-saves-close" type="button" class="qv-manage-only btn-icon btn-icon-sm hover:preset-tonal" aria-label="Close" data-chrome-key-aria-label="CloseDialog">
                <svg class="qv-icon" aria-hidden="true"><use href="#x"></use></svg>
            </button>
        </div>

        <div id="qv-saves-error" class="hidden card preset-tonal-error p-3 text-sm"></div>

        <!-- Manage: save the game as it is now, into a new slot. The name is optional: an unnamed
             save is shown by where the player was and when (renderSavesList in wasm-player.js). -->
        <form id="qv-saves-save-form" class="qv-manage-only flex gap-2">
            <input id="qv-saves-name-input" class="input min-w-0" type="text" placeholder="Name (optional)" aria-label="Name (optional)" autocomplete="off" data-chrome-key-placeholder="SaveNameOptional" data-chrome-key-aria-label="SaveNameOptional">
            <button id="qv-saves-save-new" type="submit" class="btn preset-filled-primary-700-300 min-w-20" autofocus data-chrome-key="SaveButton">Save</button>
        </form>

        <!-- Boot: carry on from the newest save, or start again. Older saves are listed below. -->
        <div class="qv-boot-only space-y-2">
            <button id="qv-saves-continue" type="button" class="btn preset-filled-primary-700-300 w-full flex-col items-start gap-0 text-left py-2" aria-describedby="qv-saves-continue-detail">
                <span data-chrome-key="ContinueGame">Continue</span>
                <span id="qv-saves-continue-detail" class="qv-saves-continue-detail text-sm font-normal"></span>
            </button>
            <button id="qv-saves-start-new" type="button" class="btn preset-tonal w-full" data-chrome-key="StartFromBeginning">Start from the beginning</button>
        </div>

        <h3 id="qv-saves-other-heading" class="qv-boot-only text-sm font-semibold" data-chrome-key="OtherSaves">Other saves</h3>
        <ul id="qv-saves-list" class="qv-save-rows"></ul>

        <!-- The chrome keys are on the labels' spans: applyChromeStrings replaces an element's text,
             which would take the icon with it. -->
        <div class="qv-manage-only qv-saves-footer flex flex-wrap gap-x-5 gap-y-2 pt-3">
            <button id="qv-saves-download" type="button" class="anchor qv-saves-link"><svg class="qv-icon qv-icon-sm" aria-hidden="true"><use href="#download"></use></svg><span data-chrome-key="SaveToFile">Save to file</span></button>
            <button id="qv-saves-upload-btn" type="button" class="anchor qv-saves-link"><svg class="qv-icon qv-icon-sm" aria-hidden="true"><use href="#upload"></use></svg><span data-chrome-key="LoadFromFile">Load from file</span></button>
            <input type="file" id="qv-saves-file-input" class="hidden" accept=".quest-save">
            <button id="qv-saves-restart" type="button" class="anchor qv-saves-link"><svg class="qv-icon qv-icon-sm" aria-hidden="true"><use href="#rotate-ccw"></use></svg><span data-chrome-key="StartAgain">Start again</span></button>
            <button id="qv-saves-bug-report" type="button" class="anchor qv-saves-link"><svg class="qv-icon qv-icon-sm" aria-hidden="true"><use href="#bug"></use></svg><span data-chrome-key="CopyBugReport">Copy for a bug report</span></button>
        </div>
        <div id="qv-saves-footer-confirm" class="qv-manage-only"></div>
        <p id="qv-saves-bug-report-status" class="hidden text-sm" role="status" aria-live="polite"></p>
        <textarea id="qv-saves-bug-report-text" class="hidden textarea text-xs font-mono" rows="8" readonly aria-labelledby="qv-saves-bug-report-status"></textarea>

        <!-- A save's options menu, opened by its ⋯ button and placed beside it by openSaveMenu in
             wasm-player.js. A popover, so it sits above the dialog and closes on Escape or a click
             elsewhere. -->
        <div id="qv-saves-menu" class="qv-saves-menu" popover role="menu">
            <button type="button" role="menuitem" data-menu-action="overwrite"><svg class="qv-icon qv-icon-sm" aria-hidden="true"><use href="#save"></use></svg><span data-chrome-key="OverwriteSave">Overwrite</span></button>
            <button type="button" role="menuitem" data-menu-action="rename"><svg class="qv-icon qv-icon-sm" aria-hidden="true"><use href="#pencil"></use></svg><span data-chrome-key="RenameSave">Rename</span></button>
            <button type="button" role="menuitem" data-menu-action="download"><svg class="qv-icon qv-icon-sm" aria-hidden="true"><use href="#download"></use></svg><span data-chrome-key="SaveToFile">Save to file</span></button>
            <button type="button" role="menuitem" data-menu-action="delete" class="qv-saves-menu-danger"><svg class="qv-icon qv-icon-sm" aria-hidden="true"><use href="#trash"></use></svg><span data-chrome-key="DeleteSave">Delete</span></button>
        </div>
    </div>
</dialog>

<!-- Debugger — only ever shown in editor-preview sessions (see wasm-player.js's
     WebPlayer.setCanDebug call in initWasmPlayer). #cmdDebug (in playercore.htm,
     part of the shared player chrome) opens it non-modally — see
     wasm-player.js's wireDebuggerButton.

     Position/size are entirely JS-driven (applyDebuggerRect in
     wasm-player.js applies them right after every open, before the
     first paint) rather than left to the browser's default dialog centering,
     so the whole card is a flex column filling exactly the applied
     width/height — #qv-debugger-panes (and List/Detail inside it) flex-fill
     the remaining vertical space rather than a fixed rem height. -->
<dialog id="questVivaDebugger" class="qv-chrome" aria-labelledby="qv-debugger-heading">
    <div class="card preset-filled-surface-100-900 p-6 flex flex-col h-full" id="qv-debugger-card" data-theme="wintry">
        <div id="qv-debugger-titlebar" class="flex items-start justify-between gap-4 mb-4">
            <h2 class="h3" id="qv-debugger-heading">Debugger</h2>
            <button id="qv-debugger-close" type="button" class="btn-icon preset-tonal-surface" aria-label="Close">
                <svg class="qv-icon" aria-hidden="true"><use href="#x"></use></svg>
            </button>
        </div>

        <div id="qv-debugger-tabs" class="flex flex-wrap gap-2 mb-4"></div>

        <div class="flex flex-1" id="qv-debugger-panes" style="min-height:0">
            <div id="qv-debugger-list" class="shrink-0">
                <button type="button" id="qv-debugger-list-sort"><span class="qv-debugger-sort-label">Name</span></button>
                <ul id="qv-debugger-list-items" class="space-y-1"></ul>
            </div>
            <div id="qv-debugger-splitter" role="separator" aria-orientation="vertical" aria-label="Resize object list"></div>
            <div id="qv-debugger-detail" class="flex-1 overflow-y-auto text-sm">
                <p class="text-surface-700-300">Select an item to view details.</p>
            </div>
        </div>

        <div id="qv-debugger-resize-handle" aria-hidden="true"></div>
    </div>
</dialog>
</body>
</html>
