name: e2e

# Nightly + manual, not on every push/PR — these are Playwright browser/
# Electron-driven verification scripts (tests/e2e/*.mjs), not the dotnet test
# suite. They drive real dev servers / a packaged Electron app end-to-end
# rather than mocking anything, so they're slower and younger than dotnet
# test — worth checking regularly, but too slow to put in every PR's critical
# path. The nightly run is what catches drift between the scripts and the UI
# (locator text/structure changes, timing assumptions) before it piles up
# unnoticed; workflow_dispatch is still there for an on-demand run before
# cutting a release, or after touching AppShell/WasmPlayer/WebPlayer/
# ElectronApp. Each job below matches one of the distinct local setups
# documented in the individual scripts' header comments — see those for the
# "why" behind each one.
#
# check_e2e_manifest is the one exception to "nightly + manual": it's a
# required status check on main, so it has to run — and report a result — on
# every PR regardless of what files it touches, not just ones that happen to
# touch tests/e2e/** or this workflow. (A path-filtered trigger on a required
# check is a trap: GitHub blocks merging forever on a check that never gets
# reported for PRs outside those paths, enforce_admins included — this
# workflow used to have exactly that filter, cheaply hidden until #2123's
# second commit silently failed to land in the squash-merge with nothing to
# catch it.) It fails if any tests/e2e/verify-*.mjs script isn't wired into a
# `node <script>.mjs` step below (or if a step points at a script that no
# longer exists). See tests/e2e/check-workflow-manifest.mjs. GitHub Actions
# `run:` steps are literal commands, so a new script can't be picked up by a
# glob; this check is what keeps a fresh script from silently never running.
on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC — off the hour to avoid the top-of-hour pile-up GitHub warns
    # about for scheduled workflows. Runs against whatever's on main at that
    # time regardless of whether anything changed since the last run.
    - cron: '17 3 * * *'
  # No paths: filter (see check_e2e_manifest's comment above for why) — this
  # fires on every PR. Only the manifest check actually runs, though: every
  # other job is gated on `if: github.event_name != 'pull_request'` below, so
  # they just report "skipped" for a PR at effectively no cost.
  pull_request:

jobs:
  # No servers, no npm install — just verifies the scripts and the workflow
  # below haven't drifted apart. Fast enough to run on every trigger.
  check_e2e_manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node tests/e2e/check-workflow-manifest.mjs
  # AppShell (Debug WasmEditor) + WasmPlayer (Debug), one Vite dev server and
  # one WasmPlayer dev server shared by every script that doesn't need a
  # special AppShell build/env — each script normally defaults to its own
  # port for local ad-hoc use, but here they both get pointed at the same
  # instances via an explicit baseUrl arg. WasmPlayer is needed because
  # verify-appshell-play-open-file.mjs and verify-appshell-play-refresh.mjs
  # boot a game through AppShell's Play tab, which proxies /player to it (see
  # vite.config.ts).
  appshell_chromium:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools

      - run: dotnet build src/WasmEditor/WasmEditor.csproj -c Debug
      - run: dotnet build src/WasmPlayer/WasmPlayer.csproj -c Debug

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            src/AppShell/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci
        working-directory: src/AppShell
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Start WasmPlayer dev server (5175)
        run: node src/WasmPlayer/dev-server.mjs &

      - name: Wait for WasmPlayer dev server
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:5175/" > /dev/null && break
            [ "$i" -eq 30 ] && { echo "port 5175 never came up"; exit 1; }
            sleep 1
          done

      - name: Start AppShell dev server (5174)
        run: npx vite dev --port 5174 &
        working-directory: src/AppShell
        env:
          PUBLIC_SHOW_HOME: true

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:5174/" > /dev/null && break
            [ "$i" -eq 30 ] && { echo "port 5174 never came up"; exit 1; }
            sleep 1
          done

      - run: node verify-appshell-opfs-default.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-autosave.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-play-open-file.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-play-refresh.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-advanced-tree.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-addscript-modal-mobile.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-advanced-controls.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-assetpicker-mobile-overflow.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-attributes-panel-pinned.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-attributes-stack-scroll.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-attributes-verbs-stack.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-code-view.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-download-button.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-empty-advanced-categories.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-exits-editor.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-game-status-attributes-scroll.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-gamebook-mode.mjs http://localhost:5174
        working-directory: tests/e2e
      - run: node verify-appshell-home-button.mjs http://localhost:5174
