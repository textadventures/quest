name: e2e

# Nightly + manual + release-branch pushes — these are Playwright browser/
# Electron-driven tests (tests/e2e), not the dotnet test suite. Each job
# starts the server its tests need and runs one Playwright Test project
# (tests/e2e/playwright.config.mjs), which picks up every *.spec.mjs in that
# project's directory. They drive real dev servers / a packaged Electron app end-to-end rather than
# mocking anything, so they're slower and younger than dotnet
# test — worth checking regularly, but too slow to put in every PR's critical
# path. The nightly run is what catches drift between the tests and the UI
# (locator text/structure changes, timing assumptions) before it piles up
# unnoticed; workflow_dispatch is still there for an on-demand run before
# cutting a release, or after touching AppShell/WasmPlayer/
# ElectronApp. Release branches (release/**) also run on every push: GitHub
# only fires `schedule` on the default branch, and a push there means a
# backport just merged, so a backport that behaves differently on the older
# branch is caught when it lands, not at release time. Each job below
# matches one of the distinct local setups documented in the individual
# specs' header comments — see those for the "why" behind each one.
#
# check_e2e_manifest is the one exception to "nightly + manual": it's a
# required status check on main, so it has to run — and report a result — on
# every PR regardless of what files it touches, not just ones that happen to
# touch tests/e2e/** or this workflow. (A path-filtered trigger on a required
# check is a trap: GitHub blocks merging forever on a check that never gets
# reported for PRs outside those paths, enforce_admins included — this
# workflow used to have exactly that filter, cheaply hidden until #2123's
# second commit silently failed to land in the squash-merge with nothing to
# catch it.) It fails if a *.spec.mjs file sits outside every Playwright
# project's directory, if a project has no `npx playwright test --project=`
# step below, or if an old-style verify-*.mjs script is left behind: any of
# those would never run. See tests/e2e/check-workflow-manifest.mjs.
on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC — off the hour to avoid the top-of-hour pile-up GitHub warns
    # about for scheduled workflows. Runs against whatever's on main at that
    # time regardless of whether anything changed since the last run.
    - cron: '17 3 * * *'
  # No paths: filter (see check_e2e_manifest's comment above for why) — this
  # fires on every PR. Only the manifest check actually runs, though: every
  # other job is gated on `if: github.event_name != 'pull_request'` below, so
  # they just report "skipped" for a PR at effectively no cost.
  pull_request:
  # Release branches only change through backport PRs (usually several
  # bundled into one) and release-please's release PRs, so this runs rarely.
  # A release PR's merge touches only these files and is tagged as soon as it
  # lands, so a run then would be too late to matter.
  push:
    branches: ['release/**']
    paths-ignore:
      - VERSION
      - CHANGELOG.md
      - .release-please-manifest.json

jobs:
  # Every job sets timeout-minutes at roughly twice its usual runtime, so a hung
  # test costs minutes rather than GitHub's six-hour default (nightly run
  # 41435260262 sat in the WasmPlayer autoscroll script until that cancelled it).
  # No servers, no npm install — just verifies the specs, config and workflow
  # below haven't drifted apart. Fast enough to run on every trigger.
  check_e2e_manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/e2e/check-workflow-manifest.mjs
  # AppShell (Debug WasmEditor) + WasmPlayer (Debug), one Vite dev server and
  # one WasmPlayer dev server shared by every spec in the appshell project.
  # WasmPlayer is needed because appshell/play-open-file.spec.mjs and
  # appshell/play-refresh.spec.mjs boot a game through AppShell's Play tab, which proxies /player to it (see
  # vite.config.ts).
  appshell_chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet workload install wasm-tools

      - run: dotnet build src/WasmEditor/WasmEditor.csproj -c Debug
      - run: dotnet build src/WasmPlayer/WasmPlayer.csproj -c Debug

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            src/AppShell/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci
        working-directory: src/AppShell
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Start WasmPlayer dev server (5175)
        run: node src/WasmPlayer/dev-server.mjs &

      - name: Wait for WasmPlayer dev server
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:5175/" > /dev/null && break
            [ "$i" -eq 30 ] && { echo "port 5175 never came up"; exit 1; }
            sleep 1
          done

      - name: Start AppShell dev server (5174)
        run: npx vite dev --port 5174 &
        working-directory: src/AppShell

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:5174/" > /dev/null && break
            [ "$i" -eq 30 ] && { echo "port 5174 never came up"; exit 1; }
            sleep 1
          done

      - run: npx playwright test --project=appshell
        working-directory: tests/e2e
        env:
          APPSHELL_URL: http://localhost:5174
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-appshell
          path: tests/e2e/playwright-report/
          retention-days: 14

  # OPFS local-drafts behavior on non-FSA browsers, against a Release
  # WasmEditor build — createSyncAccessHandle (Safari's write path) needs the
  # Release build's real dotnet runtime bits present.
  #
  # Firefox only, not WebKit: Playwright's Linux WebKit build doesn't
  # implement OPFS at all (navigator.storage.getDirectory is undefined there,
  # confirmed on an actual Actions ubuntu-latest run — not a sandbox-specific
  # flake), so appshell-firefox/local-drafts.spec.mjs's webkit variant can never
  # pass here. It's still meant to be run by hand against real Safari
  # locally (see that spec's own header comment) — just not from Linux CI.
  appshell_opfs_firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet workload install wasm-tools

      - run: dotnet publish src/WasmEditor/WasmEditor.csproj -c Release

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            src/AppShell/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci
        working-directory: src/AppShell
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps firefox
        working-directory: tests/e2e

      - name: Start AppShell dev server (5174, Release WasmEditor)
        run: npx vite dev --port 5174 &
        working-directory: src/AppShell
        env:
          WASM_CONFIG: Release

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:5174/" > /dev/null && break
            [ "$i" -eq 30 ] && { echo "port 5174 never came up"; exit 1; }
            sleep 1
          done

      - run: npx playwright test --project=appshell-firefox
        working-directory: tests/e2e
        env:
          APPSHELL_URL: http://localhost:5174
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-appshell-firefox
          path: tests/e2e/playwright-report/
          retention-days: 14

  # WasmPlayer alone, no AppShell involved.
  wasmplayer_chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet workload install wasm-tools
      # The trimmed Release publish that actually ships, not Debug: Debug is
      # untrimmed, so a game script reaching a .NET method the trimmer removed
      # would only ever fail in production.
      - run: dotnet publish src/WasmPlayer/WasmPlayer.csproj -c Release

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Start WasmPlayer dev server (5175, Release)
        run: node src/WasmPlayer/dev-server.mjs --release &

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:5175/" > /dev/null && break
            [ "$i" -eq 30 ] && { echo "port 5175 never came up"; exit 1; }
            sleep 1
          done

      # qv-preview.spec.mjs serves the Release AppBundle published above, from a qv built here.
      - run: dotnet build src/Cli

      - run: npx playwright test --project=wasmplayer
        working-directory: tests/e2e
        env:
          WASMPLAYER_URL: http://localhost:5175
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-wasmplayer
          path: tests/e2e/playwright-report/
          retention-days: 14

  # Real, packaged Electron app (Playwright's _electron launcher) — macos-
  # latest, not ubuntu-latest (unlike build_electron in build-and-test.yml,
  # which only proves the build pipeline, never launches Electron itself): a
  # real Electron window on Linux CI needs both Xvfb (no X server in the
  # container) and --no-sandbox (the SUID-root chrome-sandbox helper needs
  # setup a plain `npm install` doesn't do — see electron.sh's comment on this
  # same issue). macOS runners have a real GUI session already, so neither
  # applies. Also the runner electron-publish.yml already uses for DMG builds.
  electron:
    runs-on: macos-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet workload install wasm-tools

      - run: dotnet build src/WasmEditor/WasmEditor.csproj -c Debug
      - run: dotnet build src/WasmPlayer/WasmPlayer.csproj -c Debug

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            src/AppShell/package-lock.json
            src/ElectronApp/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci
        working-directory: src/AppShell
      - run: npm run build
        working-directory: src/AppShell

      - run: npm ci
        working-directory: src/ElectronApp
      - run: npm run build
        working-directory: src/ElectronApp

      - run: npm ci
        working-directory: tests/e2e

      - run: npx playwright test --project=electron
        working-directory: tests/e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-electron
          path: tests/e2e/playwright-report/
          retention-days: 14

  # questviva.com docs/marketing site (site/, separate Astro project) —
  # no AppShell/Engine build needed at all, just the static site itself.
  site_chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            site/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Start site preview server (4321)
        run: npx astro preview &
        working-directory: site

      - name: Wait for site preview server
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:4321/" > /dev/null && break
            [ "$i" -eq 30 ] && { echo "port 4321 never came up"; exit 1; }
            sleep 1
          done

      - run: npx playwright test --project=site
        working-directory: tests/e2e
        env:
          SITE_URL: http://localhost:4321
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-site
          path: tests/e2e/playwright-report/
          retention-days: 14
