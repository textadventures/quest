name: Deploy play.questviva.com and AppShell

# Runs when a version tag is pushed (e.g. v6.0.0-beta.30, normally via
# release-please merging its release PR), keeping play.questviva.com on the
# same release cadence as the WebPlayer Docker image. Tag pushes also attach
# WasmPlayer/AppBundle/AppShell build artifacts to the GitHub Release
# release-please already created and dispatch a deploy to
# textadventures.co.uk, so a single release cadence drives both
# play.questviva.com and AppShell on textadventures.co.uk.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION file
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install .NET WASM workload
        run: dotnet workload install wasm-tools

      - name: Build WasmEditor
        run: dotnet build src/WasmEditor/WasmEditor.csproj -c Release

      - name: Build WasmPlayer
        run: dotnet build src/WasmPlayer/WasmPlayer.csproj -c Release

      # BASE_PATH is unset (defaults to root) and PUBLIC_SHOW_HOME=true — this
      # build serves the Play/Create Home content at root and /open, plus the
      # editor itself once a game is loaded (see src/AppShell/src/routes/).
      # Distinct from the textadventures.co.uk build below, which keeps
      # BASE_PATH=/questviva and PUBLIC_SHOW_HOME unset (that origin has its
      # own site navigation, not a game-browser homepage).
      - name: Build AppShell
        run: npm ci && npm run build
        working-directory: src/AppShell
        env:
          PUBLIC_APPSHELL_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          PUBLIC_HAS_SERVER: false
          PUBLIC_SHOW_HOME: true

      - name: Assemble deploy directory
        run: |
          mkdir -p deploy/AppBundle deploy/player
          cp -r src/AppShell/build/. deploy/
          cp -r src/WasmEditor/bin/Release/net10.0/browser-wasm/AppBundle/. deploy/AppBundle/
          cp -r src/WasmPlayer/bin/Release/net10.0/browser-wasm/AppBundle/. deploy/player/
          cat > deploy/_headers <<'EOF'
          # Cloudflare Pages' default for a static asset is
          # `max-age=0, must-revalidate`, so without these rules a warm reload
          # of /player spends ~210 conditional requests to move ~90 KB. Every
          # path listed below is only ever requested with a `?v=<release>`
          # cache key on it (WasmPlayer: inject-version.mjs stamps the markup,
          # wasm-player.js the assets it fetches from JS; AppShell: wasm.ts) or
          # is already content-hashed by Vite (/_app/immutable), so a deploy
          # always produces a fresh URL and these can be cached indefinitely.
          #
          # For _framework/* the version is also what makes this *safe*, and it
          # replaces the blanket `Cache-Control: no-cache` that used to sit
          # here: those filenames aren't content-hashed and AOT output isn't
          # byte-reproducible, so a browser pairing a cached dotnet.boot.js
          # (the manifest of per-file SHA-256 hashes) with a binary from a
          # later deploy got an SRI failure. Stamping both with the same
          # version means they can't come from different deploys.
          #
          # Add nothing here that isn't requested with that version — an
          # `immutable` response to an unversioned URL cannot be busted by any
          # later deploy, by us or by the visitor. Three things are deliberately
          # left on the default `must-revalidate` for exactly that reason:
          # /player/index.html (which is what delivers each new version in the
          # first place), /player/lib/images/* (referenced by relative URL from
          # inside jquery-ui.min.css, so never stamped), and
          # /AppBundle/_framework/dotnet.native.js.symbols (WasmEditor sets
          # WasmEmitSymbolMap, and the runtime doesn't route that one asset
          # through the resource loader that stamps all the others) — hence
          # matching _framework/ by extension below rather than with a blanket
          # `/*`, so the symbols file falls through to the default.
          #
          # Pattern semantics, confirmed against the live deployment rather
          # than assumed: a `*` spans `/` (the `/*.js` rule below reaches
          # /player/lib/paper.js), and a match is anchored at both ends (that
          # same rule does *not* catch dotnet.native.js.symbols).
          /player/_framework/*.wasm
            Cache-Control: public, max-age=31536000, immutable

          /player/_framework/*.dat
            Cache-Control: public, max-age=31536000, immutable

          /AppBundle/_framework/*.wasm
            Cache-Control: public, max-age=31536000, immutable

          /AppBundle/_framework/*.dat
            Cache-Control: public, max-age=31536000, immutable

          /AppBundle/_framework/*.js
            Cache-Control: public, max-age=31536000, immutable

          /_app/immutable/*
            Cache-Control: public, max-age=31536000, immutable

          # Covers /player/lib/* and the four /player/_framework/*.js files too.
          /player/*.js
            Cache-Control: public, max-age=31536000, immutable

          /player/*.css
            Cache-Control: public, max-age=31536000, immutable

          /player/*.svg
            Cache-Control: public, max-age=31536000, immutable

          # Fetched by wasm-player.js at boot. Spelled out in full rather than
          # as `*.htm`, so there is no chance of it also catching index.html.
          /player/playercore.htm
            Cache-Control: public, max-age=31536000, immutable

          /*.js
            Content-Type: application/javascript; charset=utf-8
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=play-questviva --branch=main

      - name: Package WasmPlayer artifact
        run: (cd src/WasmPlayer/bin/Release/net10.0/browser-wasm/AppBundle && zip -r $GITHUB_WORKSPACE/WasmPlayer.zip .)

      # AppShell's build bakes BASE_PATH into its assets, so it needs a second
      # build for textadventures.co.uk's /questviva path (WasmEditor's output
      # isn't BASE_PATH-sensitive, so the earlier build is reused as-is).
      - name: Build AppShell for textadventures.co.uk
        if: github.ref_type == 'tag'
        run: npm run build
        working-directory: src/AppShell
        env:
          PUBLIC_APPSHELL_VERSION: ${{ github.ref_name }}
          BASE_PATH: /questviva
          PUBLIC_HAS_SERVER: true

      - name: Package editor artifacts for textadventures.co.uk
        if: github.ref_type == 'tag'
        run: |
          (cd src/WasmEditor/bin/Release/net10.0/browser-wasm/AppBundle && zip -r $GITHUB_WORKSPACE/AppBundle.zip .)
          (cd src/AppShell/build && zip -r $GITHUB_WORKSPACE/WebEditor.zip .)

      - name: Attach player and editor builds to GitHub Release
        # release-please creates the GitHub Release itself (with changelog-based
        # notes) before pushing the tag that triggers this workflow, so just
        # upload assets to it rather than creating a new one. The release is a
        # draft at this point (see release-please.yml) — uploading assets to
        # a draft works fine, no different from a published release.
        if: github.ref_type == 'tag'
        run: gh release upload ${{ github.ref_name }} WasmPlayer.zip AppBundle.zip WebEditor.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pinning WEBEDITOR_VERSION and dispatching textadventures.co.uk's
      # redeploy used to happen right here, but that redeploy's own `gh
      # release download --repo textadventures/quest` uses a plain
      # GITHUB_TOKEN scoped to that *other* repo, which has no visibility
      # into a still-draft release on this one — and since this job usually
      # finishes well before electron-publish.yml's macOS leg (code signing +
      # notarization, often 15+ minutes), the release would almost always
      # still be a draft at this point. Both steps now live in
      # finalize-release.yml, which only runs them once the release is
      # confirmed public.
