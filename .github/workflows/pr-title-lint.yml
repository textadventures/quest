name: Lint PR title

# PRs are squash-merged, so the PR title becomes the commit message on main
# that release-please parses to decide what changed and how to version it.
# This enforces the Conventional Commits prefix (fix:, feat:, chore:, etc.)
# that release-please needs to do that.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Scope is optional (requireScope unset), but when given it must be
          # one of these audience areas, exact case, so scoped changelog
          # entries cluster and capitalize consistently. The scope says who
          # would notice the change, not which projects it touches: an editor
          # fix spanning AppShell, EditorCore and Engine is just "Editor".
          # Omit the scope when a change affects everyone or no one.
          #   Player  - playing games (WebPlayer, WasmPlayer, PlayerCore, and
          #             engine behaviour players see)
          #   Editor  - authoring games (AppShell, EditorCore, WasmEditor, and
          #             editor-facing Core library changes)
          #   Desktop - the Electron app specifically
          #   Site    - questviva.com (site/), including the documentation
          #   e2e     - tests/e2e/*.mjs scripts, which span multiple areas
          #   main    - release-please's own "chore(main): release X.Y.Z" PRs
          #   release/6.0 - the same, for this patch branch's release PRs
          scopes: |
            Player
            Editor
            Desktop
            Site
            e2e
            main
            release/6.0

      # A backport into a release branch is merged with a merge commit (so the
      # cherry-picked commits keep their own titles), and that merge commit is
      # titled with the PR title. release-please reads it as a commit too, so a
      # fix: title would list the backport in the changelog a second time. A
      # chore(<branch>): title is left out of the changelog instead, which also
      # matches release-please's own "chore(release/6.0): release 6.0.N" PRs.
      # See "Backporting" in docs/release-channels.md.
      - name: Require chore(<branch>) titles on release branches
        if: startsWith(github.event.pull_request.base.ref, 'release/')
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$TITLE" != "chore($BASE): "* ]]; then
            echo "::error::PRs into $BASE must be titled \"chore($BASE): ...\", e.g. \"chore($BASE): backport #1234\". See \"Backporting\" in docs/release-channels.md."
            exit 1
          fi
