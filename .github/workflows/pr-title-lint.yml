name: Lint PR title

# The PR title becomes the commit message release-please parses (directly when
# squash-merged, via the merge commit body otherwise; a backport into a release
# branch replaces it with a commit override, see below), and a commit without a
# Conventional Commits prefix (fix:, feat:, chore:, etc.) never triggers a
# release. This enforces the prefix only. Scopes are deliberately not enforced:
# see the release notes convention in CLAUDE.md.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A PR into a release branch is titled chore(<branch>):, matching
      # release-please's own "chore(release/6.0): release 6.0.N" PRs. A
      # backport is squash-merged, and release-please leaves a chore: commit out
      # of the changelog, so the backport's description must carry a
      # BEGIN_COMMIT_OVERRIDE block with the original fix: or feat: title(s).
      # release-please reads that instead of the commit message; without it, a
      # backported fix never shows up in a release or triggers one. This runs on
      # "edited" too, so adding the block to the description re-checks it. See
      # "Backporting" in docs/release-channels.md.
      - name: Require chore(<branch>) titles and commit overrides on release branches
        if: startsWith(github.event.pull_request.base.ref, 'release/')
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$TITLE" != "chore($BASE): "* ]]; then
            echo "::error::PRs into $BASE must be titled \"chore($BASE): ...\", e.g. \"chore($BASE): backport #1234\". See \"Backporting\" in docs/release-channels.md."
            exit 1
          fi
          if [[ "$TITLE" == "chore($BASE): backport"* && ( "$BODY" != *BEGIN_COMMIT_OVERRIDE* || "$BODY" != *END_COMMIT_OVERRIDE* ) ]]; then
            echo "::error::A backport's description must include a BEGIN_COMMIT_OVERRIDE ... END_COMMIT_OVERRIDE block with the original PR title(s), e.g. \"fix(Player): ... (#1234)\", or release-please won't list the fix. See \"Backporting\" in docs/release-channels.md."
            exit 1
          fi
