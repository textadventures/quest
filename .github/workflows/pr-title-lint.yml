name: Lint PR title

# The PR title becomes the commit message release-please parses (directly when
# squash-merged, via the merge commit body otherwise), and a commit without a
# Conventional Commits prefix (fix:, feat:, chore:, etc.) never triggers a
# release. This enforces the prefix only. Scopes are deliberately not enforced:
# see the release notes convention in CLAUDE.md.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
