name: Publish qv binaries

# Builds the `qv` command-line tool (src/Cli) as a self-contained single-file binary for each
# platform, so it runs without a .NET install, and attaches them to the tag's GitHub Release as
# qv-<rid>.tar.gz (qv-<rid>.zip on Windows). The names carry no version, so
# releases/latest/download/qv-<rid>.tar.gz always fetches the latest stable one. The same tool is
# also published to NuGet as a dotnet tool, by nuget-publish.yml.
#
# finalize-release.yml waits for this, as well as deploy-play.yml and electron-publish.yml, before
# making the release public. A pull request that changes the tool builds the binaries too, without
# attaching them anywhere, so a break shows up before a release depends on it.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/Cli/**'
      - '.github/workflows/cli-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only runs signed binaries, so the macOS ones are built on a Mac, where
          # the SDK signs them ad hoc. They aren't notarized: a copy downloaded with a browser
          # is quarantined (curl doesn't quarantine it).
          - os: macos-latest
            rids: osx-arm64 osx-x64
          - os: ubuntu-latest
            rids: linux-x64 linux-arm64 win-x64 win-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION file
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build binaries
        run: |
          VERSION="$(cat VERSION)"
          mkdir -p dist
          for rid in ${{ matrix.rids }}; do
            dotnet publish src/Cli --configuration Release --runtime "$rid" --self-contained \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none -p:Version="$VERSION" --output "out/$rid"
            # Only the binary: the Core library is embedded in it, so the Core/ folder publish also
            # copies isn't needed.
            if [[ "$rid" == win-* ]]; then
              (cd "out/$rid" && zip -q "../../dist/qv-$rid.zip" qv.exe)
            else
              tar -czf "dist/qv-$rid.tar.gz" -C "out/$rid" qv
            fi
          done
          ls -l dist

      - name: Smoke-test this runner's own binary
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) rid=osx-arm64 ;;
            Linux-x86_64) rid=linux-x64 ;;
            *) echo "No binary for this runner to test"; exit 0 ;;
          esac
          "out/$rid/qv" --version
          printf 'look\nquit\n' | "out/$rid/qv" play examples/simple.aslx | grep -q "The game has ended."

      # Keeps a manual run's binaries downloadable from the run page.
      - uses: actions/upload-artifact@v7
        with:
          name: qv-${{ matrix.os }}
          path: dist/*

      - name: Attach to the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} dist/* --clobber
