name: Publish qv binaries

# Builds the `qv` command-line tool (src/Cli) as a self-contained single-file binary for each
# platform, so it runs without a .NET install, and attaches them to the tag's GitHub Release as
# qv-<rid>.tar.gz (qv-<rid>.zip on Windows). The names carry no version, so
# releases/latest/download/qv-<rid>.tar.gz always fetches the latest stable one. The same tool is
# also published to NuGet as a dotnet tool, by nuget-publish.yml. There's no Intel Mac build, as
# there's none of the desktop app either.
#
# finalize-release.yml waits for this, as well as deploy-play.yml and electron-publish.yml, before
# making the release public. A pull request that changes the tool builds the binaries too, without
# attaching them anywhere, so a break shows up before a release depends on it.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/Cli/**'
      - '.github/workflows/cli-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS binary is built on a Mac: it has to be signed to run on Apple Silicon at all,
          # and notarized for Gatekeeper to accept a downloaded copy.
          - os: macos-latest
            rids: osx-arm64
          - os: ubuntu-latest
            rids: linux-x64 linux-arm64 win-x64 win-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Developer ID signing and notarization need the Apple secrets, which pull requests don't
      # get; their macOS build keeps the SDK's ad hoc signature, which is enough to run it here.
      NOTARIZE: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches VERSION file
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build binaries
        run: |
          for rid in ${{ matrix.rids }}; do
            dotnet publish src/Cli --configuration Release --runtime "$rid" --self-contained \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none -p:Version="$(cat VERSION)" --output "out/$rid"
          done

      # The same throwaway-keychain setup as electron-publish.yml, which explains why it doesn't
      # leave this to any tool's own keychain handling.
      - name: Import Developer ID certificate into a signing keychain
        if: env.NOTARIZE == 'true'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$MAC_CSC_LINK" | base64 -d > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 21600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          if ! grep -q "Developer ID Application" <<< "$IDENTITIES"; then
            echo "::error::No 'Developer ID Application' identity in the keychain after importing MAC_CSC_LINK"
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Notarization requires the hardened runtime, and .NET needs qv.entitlements to run under it.
      # A bare executable can't have its ticket stapled, so Gatekeeper looks it up online instead.
      - name: Sign and notarize the macOS binary
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          BIN=out/osx-arm64/qv
          codesign --force --options runtime --timestamp --entitlements src/Cli/qv.entitlements \
            --keychain "$KEYCHAIN" --sign "Developer ID Application" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$KEY"
          ditto -c -k "$BIN" "$RUNNER_TEMP/qv-notarize.zip"
          RESULT="$(xcrun notarytool submit "$RUNNER_TEMP/qv-notarize.zip" --key "$KEY" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json)"
          echo "$RESULT"
          if [ "$(jq -r .status <<< "$RESULT")" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id <<< "$RESULT")" --key "$KEY" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::Notarization of qv failed"
            exit 1
          fi

      - name: Smoke-test this runner's own binary
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) rid=osx-arm64 ;;
            Linux-x86_64) rid=linux-x64 ;;
            *) echo "No binary for this runner to test"; exit 0 ;;
          esac
          "out/$rid/qv" --version
          printf 'look\nquit\n' | "out/$rid/qv" play examples/simple.aslx | grep -q "The game has ended."

      - name: Package binaries
        run: |
          mkdir -p dist
          for rid in ${{ matrix.rids }}; do
            # Only the binary: the Core library is embedded in it, so the Core/ folder publish also
            # copies isn't needed.
            if [[ "$rid" == win-* ]]; then
              (cd "out/$rid" && zip -q "../../dist/qv-$rid.zip" qv.exe)
            else
              tar -czf "dist/qv-$rid.tar.gz" -C "out/$rid" qv
            fi
          done
          ls -l dist

      # Keeps a manual run's binaries downloadable from the run page.
      - uses: actions/upload-artifact@v7
        with:
          name: qv-${{ matrix.os }}
          path: dist/*

      - name: Attach to the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} dist/* --clobber

      - name: Delete the signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true
