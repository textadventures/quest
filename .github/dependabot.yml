version: 2
# The npm groups take only minor and patch updates, so dependabot-automerge.yml
# can merge them once CI passes. Major updates arrive as one PR per package
# for a human to review: lumped into a group, one breaking major (SvelteKit 3,
# say) failed CI for every other update in it, and stopped the whole group
# from auto-merging.
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      site-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/src/AppShell"
    schedule:
      interval: "weekly"
    # @types/node tracks the Node major CI builds AppShell with (22, see the
    # workflows' setup-node), not the latest Node.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 isn't accepted by SvelteKit (2 or 3), typescript-eslint
      # or svelte-check yet (#2482). Remove this once their peer ranges allow
      # it. ElectronApp has none of those and is already on 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Packages whose majors only work together, listed before the catch-all
    # so their majors share a PR: @sveltejs/kit 3 needs adapter-static 4 (the
    # old adapter only accepts kit 2), and skeleton-svelte must match the
    # skeleton CSS version. Their minor and patch updates still go through
    # appshell-dependencies.
    groups:
      sveltekit-major:
        patterns:
          - "@sveltejs/kit"
          - "@sveltejs/adapter-*"
        update-types:
          - "major"
      skeleton-major:
        patterns:
          - "@skeletonlabs/*"
        update-types:
          - "major"
      appshell-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"

  # electron and electron-builder get their own group so that
  # dependabot-automerge.yml can leave them for a human: electron-builder is
  # the release-signing path, and a bug there has broken a release before.
  - package-ecosystem: "npm"
    directory: "/src/ElectronApp"
    schedule:
      interval: "weekly"
    # @types/node tracks the Node major that Electron bundles (24 for
    # Electron 43 and 44), not the latest Node. Bump it by hand with Electron.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      electron:
        patterns:
          - "electron"
          - "electron-builder"
      electronapp-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"

  # Only the chrome CSS/icon build tooling. The player's vendored jQuery,
  # jQuery UI and paper.js under player-ui/lib aren't npm packages: see
  # player-ui/lib/README.md for why they're pinned.
  - package-ecosystem: "npm"
    directory: "/src/WasmPlayer"
    schedule:
      interval: "weekly"
    groups:
      wasmplayer-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    groups:
      e2e-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "nuget"
    directory: "/tests"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
