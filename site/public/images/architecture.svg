<svg viewBox="0 0 700 630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="700" height="630" fill="#ffffff"/>

  <!-- connectors (drawn first, under boxes) -->
  <g stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="560" y1="75" x2="560" y2="128" />
    <line x1="560" y1="185" x2="560" y2="228" />
    <line x1="560" y1="285" x2="560" y2="328" />
    <line x1="500" y1="285" x2="382" y2="328" />
    <line x1="120" y1="185" x2="322" y2="328" />
    <line x1="340" y1="185" x2="340" y2="328" />
    <line x1="340" y1="385" x2="340" y2="428" />
    <line x1="400" y1="385" x2="522" y2="428" />
    <line x1="520" y1="385" x2="382" y2="428" />
    <line x1="340" y1="485" x2="428" y2="528" />
    <line x1="560" y1="485" x2="472" y2="528" />
  </g>

  <!-- boxes -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <!-- ElectronApp -->
    <rect x="470" y="20" width="180" height="55" rx="6" fill="#dce8f7" stroke="#333333"/>
    <text x="560" y="43">ElectronApp</text>
    <text x="560" y="61" font-size="11" font-weight="normal">desktop wrapper</text>

    <!-- WebPlayer -->
    <rect x="30" y="130" width="180" height="55" rx="6" fill="#dce8f7" stroke="#333333"/>
    <text x="120" y="153">WebPlayer</text>
    <text x="120" y="171" font-size="11" font-weight="normal">ASP.NET Core + Blazor</text>

    <!-- WasmPlayer -->
    <rect x="250" y="130" width="180" height="55" rx="6" fill="#dce8f7" stroke="#333333"/>
    <text x="340" y="153">WasmPlayer</text>
    <text x="340" y="171" font-size="11" font-weight="normal">browser-wasm, AOT</text>

    <!-- AppShell -->
    <rect x="470" y="130" width="180" height="55" rx="6" fill="#dce8f7" stroke="#333333"/>
    <text x="560" y="153">AppShell</text>
    <text x="560" y="171" font-size="11" font-weight="normal">SvelteKit editor SPA</text>

    <!-- WasmEditor -->
    <rect x="470" y="230" width="180" height="55" rx="6" fill="#ffffff" stroke="#333333"/>
    <text x="560" y="253">WasmEditor</text>
    <text x="560" y="271" font-size="11" font-weight="normal">JS/WASM bridge</text>

    <!-- PlayerCore -->
    <rect x="250" y="330" width="180" height="55" rx="6" fill="#ffffff" stroke="#333333"/>
    <text x="340" y="362">PlayerCore</text>

    <!-- EditorCore -->
    <rect x="470" y="330" width="180" height="55" rx="6" fill="#ffffff" stroke="#333333"/>
    <text x="560" y="362">EditorCore</text>

    <!-- Engine -->
    <rect x="250" y="430" width="180" height="55" rx="6" fill="#ffffff" stroke="#333333"/>
    <text x="340" y="462">Engine</text>

    <!-- Legacy -->
    <rect x="470" y="430" width="180" height="55" rx="6" fill="#f2f2f2" stroke="#333333"/>
    <text x="560" y="453">Legacy</text>
    <text x="560" y="471" font-size="11" font-weight="normal">Quest 1.x-4.x compat</text>

    <!-- Common -->
    <rect x="360" y="530" width="180" height="55" rx="6" fill="#f2f2f2" stroke="#333333"/>
    <text x="450" y="562">Common</text>
  </g>

  <text x="10" y="620" font-size="11" fill="#666666">Blue = things a user runs directly. White/grey = shared internals. Arrows point from a project to what it references.</text>
</svg>
