<svg viewBox="0 0 660 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="660" height="620" fill="#ffffff"/>

  <!-- connectors (drawn first, under boxes) -->
  <g stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="530" y1="75" x2="530" y2="128" />
    <line x1="530" y1="185" x2="440" y2="228" />
    <line x1="440" y1="285" x2="528" y2="328" />
    <line x1="110" y1="185" x2="189" y2="328" />
    <line x1="320" y1="185" x2="191" y2="328" />
    <line x1="440" y1="357" x2="282" y2="357" />
    <line x1="190" y1="385" x2="355" y2="428" />
    <line x1="330" y1="485" x2="192" y2="528" />
    <line x1="390" y1="485" x2="528" y2="528" />
  </g>

  <!-- boxes -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <!-- ElectronApp -->
    <rect x="440" y="20" width="180" height="55" rx="6" fill="#dce8f7" stroke="#333333"/>
    <text x="530" y="43">ElectronApp</text>
    <text x="530" y="61" font-size="11" font-weight="normal">desktop wrapper</text>

    <!-- WebPlayer -->
    <rect x="20" y="130" width="180" height="55" rx="6" fill="#dce8f7" stroke="#333333"/>
    <text x="110" y="153">WebPlayer</text>
    <text x="110" y="171" font-size="11" font-weight="normal">ASP.NET Core + Blazor</text>

    <!-- WasmPlayer -->
    <rect x="230" y="130" width="180" height="55" rx="6" fill="#dce8f7" stroke="#333333"/>
    <text x="320" y="153">WasmPlayer</text>
    <text x="320" y="171" font-size="11" font-weight="normal">browser-wasm, AOT</text>

    <!-- AppShell -->
    <rect x="440" y="130" width="180" height="55" rx="6" fill="#dce8f7" stroke="#333333"/>
    <text x="530" y="153">AppShell</text>
    <text x="530" y="171" font-size="11" font-weight="normal">SvelteKit editor SPA</text>

    <!-- WasmEditor -->
    <rect x="350" y="230" width="180" height="55" rx="6" fill="#ffffff" stroke="#333333"/>
    <text x="440" y="253">WasmEditor</text>
    <text x="440" y="271" font-size="11" font-weight="normal">JS/WASM bridge</text>

    <!-- PlayerCore -->
    <rect x="100" y="330" width="180" height="55" rx="6" fill="#ffffff" stroke="#333333"/>
    <text x="190" y="362">PlayerCore</text>

    <!-- EditorCore -->
    <rect x="440" y="330" width="180" height="55" rx="6" fill="#ffffff" stroke="#333333"/>
    <text x="530" y="362">EditorCore</text>

    <!-- Engine -->
    <rect x="270" y="430" width="180" height="55" rx="6" fill="#ffffff" stroke="#333333"/>
    <text x="360" y="462">Engine</text>

    <!-- Common -->
    <rect x="100" y="530" width="180" height="55" rx="6" fill="#f2f2f2" stroke="#333333"/>
    <text x="190" y="562">Common</text>

    <!-- Legacy -->
    <rect x="440" y="530" width="180" height="55" rx="6" fill="#f2f2f2" stroke="#333333"/>
    <text x="530" y="553">Legacy</text>
    <text x="530" y="571" font-size="11" font-weight="normal">Quest 1.x-4.x compat</text>
  </g>

  <text x="10" y="610" font-size="11" fill="#666666">Blue = things a user runs directly. White/grey = shared internals.</text>
</svg>
